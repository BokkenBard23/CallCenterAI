name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # tsc -b --noEmit resolves composite project references (root tsconfig.json has files:[] + references).
        # Plain `tsc --noEmit` is a no-op on composite projects and would always pass with ExitCode 0.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  knip:
    name: Dead code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run knip
        run: npx knip --exit-code 1

  state-validate:
    name: pipeline-state.yaml integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate pipeline-state.yaml
        # Checks: YAML parse errors, duplicate top-level keys (last-wins data loss),
        # missing required routing keys, type correctness (blockers=array, etc).
        # Runs before build to fail fast on corrupted state.
        run: node scripts/validate-pipeline-state.mjs
