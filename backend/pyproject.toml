[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "call-center-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Dialog Analysis Web Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "lxml>=5.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # FRIDA embedding integration
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
    "razdel>=0.5.0",
    "natasha>=1.6.0",
    "slowapi>=0.1.9",
    "tenacity>=8.2.0",
    # PII masking (ID-4: Presidio + NER for 152-ФЗ compliance)
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # spaCy is REQUIRED by Presidio's NlpEngineProvider for Russian NER.
    # Without spaCy + ru_core_news_sm model, PII masking is unavailable
    # and the upload endpoint returns HTTP 503 (152-ФЗ compliance guard).
    # Install the model separately (not a PyPI package):
    #   python -m spacy download ru_core_news_sm
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
# Optional ML/NLP dependencies for topic modeling and embeddings.
# Install with: pip install -e ".[ml]"
# NOTE: FRIDA embeddings use the remote Beeline AI API (/api/v2/embeddings),
#       so sentence-transformers/torch are NOT required for embeddings.
#       networkx is only needed by TopicModeler (graceful skipif if absent).
ml = [
    "networkx>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# smartlogger as local editable package from ../Transcrib
[tool.setuptools]
package-dir = {"" = "."}

[project.optional-dependencies.smartlogger]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
